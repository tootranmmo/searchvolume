<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPath Workflow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 16px;
      opacity: 0.95;
    }

    .button {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 8px;
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .status {
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
    }

    .feature {
      padding: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .feature::before {
      content: '✓ ';
      color: #4caf50;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎯 XPath Workflow</h1>
  <p>Build XPath selectors step by step with visual feedback.</p>

  <button id="toggleBtn" class="button">Toggle Sidebar</button>

  <div style="margin-top: 16px;">
    <div class="feature">Step-by-step builder</div>
    <div class="feature">Click to select elements</div>
    <div class="feature">Real-time validation</div>
    <div class="feature">Quick templates</div>
  </div>

  <div id="status" class="status">Ready to use!</div>

  <script src="popup.js"></script>
</body>
</html>
